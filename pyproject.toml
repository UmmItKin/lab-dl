[project]
name = "lab-dl"
version = "0.1.0"
description = "Download HackTheBox Academy modules and TryHackMe rooms as Markdown for offline study."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "browser_cookie3>=0.16.2",   # browser cookie auto-grab
    "beautifulsoup4>=4.12.0",    # THM only; HTB uses converter.py instead
    "markdownify>=0.13.0",
    "rich>=15.0.0",
]

[tool.uv]
package = false
